<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>

<body>

<h1>Hotel Room Booking Form</h1>

<form>

Full Name:
<input type="text">
<br><br>

Email:
<input type="email">
<br><br>

Phone:
<input type="text">
<br><br>

Check-in Date:
<input type="date">
<br><br>

Check-out Date:
<input type="date">
<br><br>

Room Type:
<select>
    <option>Single Room</option>
    <option>Double Room</option>
    <option>Deluxe Room</option>
</select>
<br><br>

Number of Guests:
<input type="number">
<br><br>

Special Requests:
<br>
<textarea rows="5" cols="40"></textarea>
<br><br>

<input type="submit" value="Book Now">
<input type="reset" value="Reset Form">

</form>

</body>
</html>
